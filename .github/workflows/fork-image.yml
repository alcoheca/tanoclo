name: Fork image (ws-server)

# Builds the add-on image for this fork and publishes it to GHCR, so Home Assistant
# can pull it instead of compiling on the device. Runs on pushes to deploy/** branches.
on:
  push:
    branches: ['deploy/**']
    paths:
      - 'ws-server/**'
      - 'tanoclo-ws-server/**'
      - '.github/docker/ws-server.Dockerfile'
      - '.github/workflows/fork-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read add-on version
        id: ver
        run: |
          VERSION=$(sed -n 's/^version: *"\(.*\)"/\1/p' tanoclo-ws-server/config.yaml | head -1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/ws-server.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/alcoheca/tanoclo-ws-server:${{ steps.ver.outputs.version }}
